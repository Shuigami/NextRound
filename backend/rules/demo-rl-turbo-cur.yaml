summary_30s:
  - 8 équipes dans un seul tableau à double élimination. Il faut perdre deux fois pour être éliminé.
  - Tous les matchs se jouent en BO5, sauf la grande finale en BO7.
  - Le champion gagne le Major et des points de circuit pour le Mondial Turbo (fictif).
circuit: >-
  Deuxième des trois Majors de la saison (fictive). Chaque Major rapporte des points. Les 8 meilleures
  équipes au cumul vont au Mondial Turbo. Le barème de points n'est pas modélisé ici.
rewards:
  - "Champion : titre du Major et points de circuit (barème non modélisé)"
  - "Toutes les équipes : points de circuit selon la place finale"
