participants: 6
summary_30s:
  - Saison régulière à 6 équipes. Chaque équipe affronte une fois chacune des autres.
  - Les matchs se jouent en « premier à 3 manches » (FT3).
  - Les 4 premiers vont en playoffs, les 2 derniers sont éliminés.
  - Playoffs en élimination directe. La finale se joue en premier à 4 manches (FT4).
circuit: >-
  Saison 3 sur 4 de la Ligue Zénith (fictive). Le champion se qualifie pour le Grand Final annuel.
  Le classement de la saison ne rapporte rien d'autre.
rewards:
  - "Champion : titre de la saison et qualification pour le Grand Final annuel (fictif)"
