    participants: 4
    summary: Tableau à élimination directe à 4 équipes. Une défaite élimine.
    formats:
      - {type: best_of, value: 5, applies_to: Demi-finales et finale}
    qualification: Les vainqueurs des demi-finales jouent la finale.
    elimination: Toute défaite est éliminatoire. Pas de match pour la 3e place.
