services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nextround
      POSTGRES_PASSWORD: nextround
      POSTGRES_DB: nextround
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextround"]
      interval: 3s
      retries: 20

  backend:
    build: ./backend
    env_file: [./backend/.env]
    environment:
      DATABASE_URL: postgresql+psycopg://nextround:nextround@db:5432/nextround
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    volumes: ["./backend/app:/app/app", "./backend/rules:/app/rules", "./backend/migrations:/app/migrations"]

  frontend:
    build:
      context: ./frontend
      args: {API_URL: "http://backend:8000"}
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
